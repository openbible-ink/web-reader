name: tests

on:
    push:
        branches:
            - main
    pull_request:

concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: web-reader

        steps:
            - name: Checkout web reader
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: web-reader
                  persist-credentials: false

            - name: Checkout USFM parser
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: openbible-ink/usfm-parser
                  path: usfm-parser
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: |
                      web-reader/package-lock.json
                      usfm-parser/package-lock.json

            - name: Build USFM parser
              working-directory: usfm-parser
              run: |
                  npm ci
                  npm test
                  npm run build

            - name: Setup application
              run: |
                  composer install --no-interaction --prefer-dist --no-progress
                  cp .env.example .env
                  php artisan key:generate
                  npm ci

            - name: Run code, test, integrity, security, and performance checks
              run: composer ci:check

            - name: Install browser
              run: npx playwright install --with-deps chromium

            - name: Run end-to-end and accessibility tests
              run: npx playwright test

            - name: Upload browser failure report
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: |
                      web-reader/playwright-report
                      web-reader/test-results
                  if-no-files-found: ignore
                  retention-days: 7
